name: ongrid-apm-demo
x-app: &app
  network_mode: host
  restart: unless-stopped
  user: "65532:65532"
  mem_limit: 256m
  cpus: 0.5
  volumes: ["/var/log/ongrid-apm-demo:/logs"]
  logging:
    driver: local
    options: {max-size: "5m", max-file: "2"}
x-env: &env
  SERVICE_NAMESPACE: apm-demo
  DEPLOYMENT_ENVIRONMENT: development
  OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none
  OTEL_TRACES_SAMPLER: always_on
  OTEL_TRACES_SAMPLER_ARG: "1"
  OTEL_METRIC_EXPORT_INTERVAL: "5000"
  OTEL_BSP_SCHEDULE_DELAY: "1000"
  OTEL_SEMCONV_STABILITY_OPT_IN: http,rpc
  OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: cumulative
  OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: explicit_bucket_histogram
  OTEL_PYTHON_SYSTEM_METRICS_EXCLUDED_METRICS: system.*,process.runtime.*
x-java-rss: &java-rss
  image: otel/opentelemetry-collector-contrib:0.157.0
  network_mode: host
  restart: unless-stopped
  user: "65532:65532"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 128m
  cpus: 0.25
  command: ["--config=/etc/otelcol/java-rss.yaml"]
  volumes: ["./java-rss.yaml:/etc/otelcol/java-rss.yaml:ro"]
  logging:
    driver: local
    options: {max-size: "5m", max-file: "2"}
services:
  go-v1:
    <<: *app
    image: ongrid-apm-demo-go:local
    build:
      context: ../..
      dockerfile: examples/apm-languages/Dockerfile
      target: go
    mem_limit: 256m
    environment:
      <<: *env
      APP_LANGUAGE: go
      HTTP_PORT: "18080"
      RPC_PORT: "18081"
      OTEL_SERVICE_NAME: apm-demo-go
      SERVICE_INSTANCE_ID: ubuntu-go-1
      SERVICE_VERSION: 1.0.0
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-go-1,service.version=1.0.0
  go-v2:
    <<: *app
    image: ongrid-apm-demo-go:local
    build:
      context: ../..
      dockerfile: examples/apm-languages/Dockerfile
      target: go
    mem_limit: 256m
    environment:
      <<: *env
      APP_LANGUAGE: go
      HTTP_PORT: "18180"
      RPC_PORT: "18181"
      OTEL_SERVICE_NAME: apm-demo-go
      SERVICE_INSTANCE_ID: ubuntu-go-2
      SERVICE_VERSION: 1.1.0-demo
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-go-2,service.version=1.1.0-demo
  java-v1:
    <<: *app
    image: ongrid-apm-demo-java:local
    build:
      context: ../..
      dockerfile: examples/apm-languages/Dockerfile
      target: java
    mem_limit: 512m
    environment:
      <<: *env
      APP_LANGUAGE: java
      HTTP_PORT: "18082"
      RPC_PORT: "18083"
      OTEL_SERVICE_NAME: apm-demo-java
      SERVICE_INSTANCE_ID: ubuntu-java-1
      SERVICE_VERSION: 1.0.0
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-java-1,service.version=1.0.0
  java-v2:
    <<: *app
    image: ongrid-apm-demo-java:local
    build:
      context: ../..
      dockerfile: examples/apm-languages/Dockerfile
      target: java
    mem_limit: 512m
    environment:
      <<: *env
      APP_LANGUAGE: java
      HTTP_PORT: "18182"
      RPC_PORT: "18183"
      OTEL_SERVICE_NAME: apm-demo-java
      SERVICE_INSTANCE_ID: ubuntu-java-2
      SERVICE_VERSION: 1.1.0-demo
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-java-2,service.version=1.1.0-demo
  java-rss-v1:
    <<: *java-rss
    pid: service:java-v1
    depends_on:
      java-v1:
        condition: service_started
        restart: true
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.name=apm-demo-java,service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-java-1,service.version=1.0.0
  java-rss-v2:
    <<: *java-rss
    pid: service:java-v2
    depends_on:
      java-v2:
        condition: service_started
        restart: true
    environment:
      OTEL_RESOURCE_ATTRIBUTES: service.name=apm-demo-java,service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-java-2,service.version=1.1.0-demo
  python-v1:
    <<: *app
    image: ongrid-apm-demo-python:local
    build:
      context: ../..
      dockerfile: examples/apm-languages/Dockerfile
      target: python
    mem_limit: 256m
    environment:
      <<: *env
      APP_LANGUAGE: python
      HTTP_PORT: "18086"
      RPC_PORT: "18087"
      OTEL_SERVICE_NAME: apm-demo-python
      SERVICE_INSTANCE_ID: ubuntu-python-1
      SERVICE_VERSION: 1.0.0
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-python-1,service.version=1.0.0
  python-v2:
    <<: *app
    image: ongrid-apm-demo-python:local
    build:
      context: ../..
      dockerfile: examples/apm-languages/Dockerfile
      target: python
    mem_limit: 256m
    environment:
      <<: *env
      APP_LANGUAGE: python
      HTTP_PORT: "18186"
      RPC_PORT: "18187"
      OTEL_SERVICE_NAME: apm-demo-python
      SERVICE_INSTANCE_ID: ubuntu-python-2
      SERVICE_VERSION: 1.1.0-demo
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=apm-demo,deployment.environment.name=development,service.instance.id=ubuntu-python-2,service.version=1.1.0-demo
  traffic:
    <<: *app
    image: ongrid-apm-demo-python:local
    environment: {APP_LANGUAGE: traffic}
    command: ["python", "/app/traffic.py"]
