# go-arch-lint 配置 — 强制 HLD §3 BC 边界（ADR-003 + ADR-005 私有 MVP 枢轴）
# 运行：make arch-lint
#
# 顶层规则：
#   - iam / manager / edgeagent 三大 BC 两两禁止互 import
#   - internal/pkg/** 不得 import 任何 BC
#   - 同一 BC 内部 service 层禁止越过 biz 直接 import 同 BC 的 data 层
#     （go-arch-lint v3 支持以独立组件 + deps 表达，见下方 iam_service / manager_service 等）
#
# v1.19.0 / schema v3。检查生产代码的 import 边界；测试允许组装真实 fixture。
# deepScan 的实现类型流分析会把构造函数注入判为反向依赖；项目允许
# 消费方接口 + cmd 装配，因此不启用该模式，禁止 import 的规则仍完整执行。

version: 3
workdir: .

allow:
  depOnAnyVendor: true
  deepScan: false

components:
  iam_service:     { in: internal/iam/service/** }
  iam_biz:         { in: internal/iam/biz/** }
  iam_data:        { in: internal/iam/data/** }
  iam_model:       { in: internal/iam/model/** }
  iam_server:      { in: internal/iam/server/** }

  manager_service: { in: internal/manager/service/** }
  manager_biz:     { in: internal/manager/biz/** }
  manager_data:    { in: internal/manager/data/** }
  manager_model:   { in: internal/manager/model/** }
  manager_server:  { in: internal/manager/server/** }

  edgeagent_service: { in: internal/edgeagent/service/** }
  edgeagent_biz:     { in: internal/edgeagent/biz/** }
  edgeagent_model:   { in: internal/edgeagent/model/** }

  cmdb_server: { in: internal/cmdb/server/** }
  cmdb_biz:    { in: internal/cmdb/biz/** }
  cmdb_data:   { in: internal/cmdb/data/** }
  cmdb_model:  { in: internal/cmdb/model/** }

  observability_preview: { in: scripts/agent-observability/** }
  test_harness: { in: tests/** }
  shared_skill: { in: internal/skill/** }
  edgeagent_runtime:
    in:
      - internal/edgeagent/bash/**
      - internal/edgeagent/cmdpolicy/**
      - internal/edgeagent/collector/**
      - internal/edgeagent/config/**
      - internal/edgeagent/dpapi/**
      - internal/edgeagent/enrollment/**
      - internal/edgeagent/edgedirs/**
      - internal/edgeagent/host_files/**
      - internal/edgeagent/install/**
      - internal/edgeagent/k8s/**
      - internal/edgeagent/operator/**
      - internal/edgeagent/packetcapture/**
      - internal/edgeagent/plugins/**
      - internal/edgeagent/restart_service/**
      - internal/edgeagent/skill/**
      - internal/edgeagent/streamrouter/**
      - internal/edgeagent/supervisorhealth/**
      - internal/edgeagent/upgradebundle/**
      - internal/edgeagent/upgrademachine/**
      - internal/edgeagent/webshell/**

  shared_pkg: { in: internal/pkg/** }
  api:        { in: api/** }
  cmd_manager: { in: cmd/ongrid/** }
  cmd_edge: { in: [cmd/ongrid-edge/**, cmd/ongrid-edge-supervisor/**] }
  cmd_ongrid_cmdb: { in: cmd/ongrid-cmdb/** }

# 允许依赖的正向清单（未列出 = 禁止）
deps:
  observability_preview:
    mayDependOn: [manager_biz, manager_server, shared_pkg]
  test_harness:
    anyProjectDeps: true
  # ---------------- iam BC ----------------
  iam_server:
    mayDependOn: [iam_server, iam_service, iam_biz, iam_model, shared_pkg, api]
  iam_service:
    # 关键：service 不得直接依赖 iam_data（必须走 biz）
    mayDependOn: [iam_service, iam_biz, iam_model, shared_pkg, api]
  iam_biz:
    mayDependOn: [iam_biz, iam_model, shared_pkg]
  iam_data:
    mayDependOn: [iam_data, iam_biz, iam_model, shared_pkg]
  iam_model:
    mayDependOn: [iam_model, shared_pkg]

  # ---------------- manager BC ----------------
  manager_server:
    mayDependOn: [manager_server, manager_service, manager_biz, manager_model, shared_pkg, api]
  manager_service:
    mayDependOn: [manager_service, manager_biz, manager_model, shared_pkg, shared_skill, api]
  manager_biz:
    mayDependOn: [manager_biz, manager_model, shared_pkg, shared_skill]
  manager_data:
    mayDependOn: [manager_data, manager_biz, manager_model, shared_pkg]
  manager_model:
    mayDependOn: [manager_model, shared_pkg]

  # ---------------- edgeagent BC ----------------
  edgeagent_service:
    mayDependOn: [edgeagent_service, edgeagent_biz, edgeagent_model, shared_pkg, api]
  edgeagent_biz:
    mayDependOn: [edgeagent_biz, edgeagent_model, edgeagent_runtime, shared_skill, shared_pkg]
  edgeagent_model:
    mayDependOn: [edgeagent_model, shared_pkg]

  edgeagent_runtime:
    mayDependOn: [edgeagent_runtime, edgeagent_biz, edgeagent_model, shared_pkg, shared_skill, api]
  shared_skill:
    mayDependOn: [shared_skill, shared_pkg]

  # ---------------- cmdb BC ----------------
  cmdb_server:
    mayDependOn: [cmdb_server, cmdb_biz, cmdb_model, shared_pkg, api]
  cmdb_biz:
    mayDependOn: [cmdb_biz, cmdb_model, shared_pkg]
  cmdb_data:
    mayDependOn: [cmdb_data, cmdb_biz, cmdb_model, shared_pkg]
  cmdb_model:
    mayDependOn: [cmdb_model, shared_pkg]

  # ---------------- 共享 ----------------
  shared_pkg:
    # 不得依赖任何 BC（业务无关）
    mayDependOn: [shared_pkg]
    anyVendorDeps: true
  api:
    anyVendorDeps: true

  # Manager 与 Edge 分别装配，禁止两个入口互相 import 对方业务域。
  cmd_manager:
    mayDependOn: [cmd_manager, iam_server, iam_service, iam_biz, iam_data, iam_model, manager_server, manager_service, manager_biz, manager_data, manager_model, shared_pkg, shared_skill, api]
  cmd_edge:
    mayDependOn: [cmd_edge, edgeagent_service, edgeagent_biz, edgeagent_model, edgeagent_runtime, shared_pkg, shared_skill, api]
  cmd_ongrid_cmdb:
    mayDependOn: [cmd_ongrid_cmdb, cmdb_server, cmdb_biz, cmdb_data, cmdb_model, shared_pkg, api]

commonComponents: []
# 包内测试允许组装真实存储/跨域 fixture；生产文件仍严格执行分层。
excludeFiles:
  - "_test\\.go$"

# Installed web dependencies are not project Go code. Without this, a local
# `npm install` makes the scan report node_modules' Go files as unattached.
exclude:
  - web/node_modules
