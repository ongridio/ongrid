name: CI Windows Cross-Build

# Linux 交叉编译覆盖 Windows 入口与测试；Windows runner 实际执行
# supervisor / upgrademachine / upgradebundle / supervisorhealth 的 race 测试。

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'internal/edgeagent/**'
      - 'cmd/ongrid-edge*/**'
      - '.github/workflows/ci-windows-cross.yml'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: ci-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-cross-build:
    name: GOOS=windows build + vet
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build, vet and compile Windows tests
        run: make check-windows-cross

  windows-native-test:
    name: Windows native tests (race)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Run Windows tests
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: make test-windows-native SHELL=bash
