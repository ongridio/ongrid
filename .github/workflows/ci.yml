name: CI

# Compile + unit-test gate. Exists because regressions like a model field
# rename that left a fakeRepo test using the old API (PR #123 broke
# `go test ./internal/manager/biz/edge/...` and sat unnoticed for weeks)
# must fail a PR, not a release build. e2e tests are `//go:build e2e`
# tagged and intentionally excluded here — they need docker + a live test
# environment; this gate is the fast unit/compile layer.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + vet + test
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify documentation changes
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-docs-only.py

      - name: Set up Go
        if: steps.changes.outputs.docs_only != 'true'
        id: go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false

      - name: Restore and refresh Go cache
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # Save completed builds per commit; restore the latest compatible cache.
          key: go-v1-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-linux-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-v1-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-linux-${{ hashFiles('go.mod', 'go.sum') }}-
            go-v1-ubuntu24-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-linux-

      - name: Set up Buf
        if: steps.changes.outputs.docs_only != 'true'
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      - name: buf lint
        if: steps.changes.outputs.docs_only != 'true'
        run: make lint-proto

      - name: go build
        if: steps.changes.outputs.docs_only != 'true'
        run: go build ./...

      - name: go vet
        if: steps.changes.outputs.docs_only != 'true'
        run: go vet ./...

      - name: go test
        if: steps.changes.outputs.docs_only != 'true'
        run: go test -race ./...

      - name: Kubernetes JVM attach capabilities
        if: steps.changes.outputs.docs_only != 'true'
        run: make test-k8s-capabilities

  web-test:
    name: web test + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify documentation changes
        id: changes
        working-directory: .
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci-docs-only.py

      - name: Set up Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify commit policy
        working-directory: .
        run: make test-commit-policy

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        # Keep DOM-heavy suites from competing for CPU within their test timeouts.
        run: >-
          npm test -- --run --no-file-parallelism
          src/api/apm.test.ts
          src/components/apm
          src/pages/Apm
          src/pages/Kubernetes.test.tsx
          src/pages/Edges.test.tsx
          src/pages/Dashboard.test.tsx
          src/pages/settings/Upgrade.test.tsx
          src/pages/settings/LLM.test.tsx
          src/pages/settings/CommunicationProviders.test.tsx
          src/components/icons/Provider.test.tsx
          src/pages/kubernetes/edgeAttachments.test.ts
          src/pages/kubernetes/registryCommands.test.ts

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build

  deployment-test:
    name: deployment manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Verify documentation-only CI routing
        run: make test-ci-docs-only

      - name: Check release scripts
        run: bash -n dist/package.sh dist/package-k8s-chart.sh dist/build-edge-attachments.sh deploy/install/install.sh deploy/install/upgrade.sh deploy/install/uninstall.sh deploy/install/public-url.sh deploy/install/data-permissions.sh deploy/install/apply-pending-upgrade.sh deploy/install/edge/fetch-edge-assets.sh deploy/install/edge/verify-edge-deps-archive.sh deploy/install/edge/edge-assets-lib.sh scripts/verify-cnb-compose-images.sh scripts/verify-release-images.sh scripts/publish-release-image.sh scripts/publish-release-image-platform.sh scripts/merge-release-image-manifest.sh scripts/test-publish-release-image.sh scripts/test-release-image-platform-publish.sh scripts/ensure-cnb-release.sh scripts/test-ensure-cnb-release.sh scripts/test-publish-cnb-release-attachments.sh scripts/test-verify-cnb-release-attachments.sh scripts/test-release-workflow.sh scripts/test-edge-assets.sh scripts/test-edge-assets-lib.sh scripts/test-edge-installer-connectivity-guard.sh scripts/test-edge-upgrade-hook-guard.sh scripts/test-public-url.sh scripts/test-upgrade-data-permissions.sh scripts/test-compose-release-package.sh scripts/test-apply-pending-upgrade.sh scripts/publish-helm-chart.sh scripts/test-publish-helm-chart.sh scripts/test-k8s-chart.sh

      - name: Verify Edge installer connectivity guard
        run: bash scripts/test-edge-installer-connectivity-guard.sh

      - name: Verify Compose image routing
        run: make verify-compose-images

      - name: Verify release image helpers
        run: make test-release-image-publish

      - name: Verify release workflow orchestration
        run: make test-release-workflow

      - name: Verify Helm Chart publish helper
        run: make test-publish-k8s-chart

      - name: Verify Compose-only release package
        run: make test-release-package

      - name: Lint and render Kubernetes chart
        run: make test-k8s-chart
