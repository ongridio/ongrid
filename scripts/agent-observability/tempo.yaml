# Isolated local acceptance store; no production configuration or volumes.
server:
  http_listen_port: 3200
  grpc_listen_port: 9095
query_frontend:
  search:
    query_backend_after: 0s
    query_ingesters_until: 1h
distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
ingester:
  trace_idle_period: 1s
  max_block_duration: 1m
compactor:
  compaction:
    block_retention: 1h
storage:
  trace:
    backend: local
    blocklist_poll: 5s
    local:
      path: /tmp/tempo/blocks
    wal:
      path: /tmp/tempo/wal
usage_report:
  reporting_enabled: false
