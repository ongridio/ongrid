syntax = "proto3";
package manager.device.v1;
import "google/protobuf/struct.proto";
option go_package = "github.com/ongridio/ongrid/api/gen/manager/device/v1;devicev1";

// PUT /v1/devices/{id}/environment (admin). Empty restores cluster inheritance.
message UpdateDeviceEnvironmentRequest {
  uint64 id = 1;
  string environment = 2;
}

// GET/PUT /v1/devices/{id}/environment. The HTTP response wraps this in data.
message DeviceEnvironment {
  string environment = 1;
  string effective_environment = 2;
  string inherited_environment = 3;
  string cluster_name = 4;
  string source = 5; // device, cluster, or unset
}

// Additive fields on the GET /v1/devices list/detail HTTP item.
// current_edge_id identifies the current installation; device_id remains durable.
message HostRuntimeBinding {
 uint64 device_id = 1;
 optional uint64 current_edge_id = 2;
}

// GET /v1/devices/{id}/plugins：长期配置归 Host，健康状态仅来自当前 Edge。
message HostPluginConfiguration {
 string plugin_name = 1;
 bool enabled = 2;
 google.protobuf.Struct spec = 3;
}
// PUT /v1/devices/{id}/plugins/{name} (admin)，无需在线即可保存普通配置。
// Profiles 属于实例会话，不支持此入口；数据库凭据写入仍需要当前连接。
message SetHostPluginRequest {
 uint64 id = 1;
 string name = 2;
 bool enabled = 3;
 google.protobuf.Struct spec = 4;
}
