syntax = "proto3";
package manager.device.v1;
import "google/protobuf/struct.proto";
option go_package = "github.com/ongridio/ongrid/api/gen/manager/device/v1;devicev1";

// PUT /v1/devices/{id}/environment (admin). Empty restores cluster inheritance.
message UpdateDeviceEnvironmentRequest {
  uint64 id = 1;
  string environment = 2;
}

// GET/PUT /v1/devices/{id}/environment. The HTTP response wraps this in data.
message DeviceEnvironment {
  string environment = 1;
  string effective_environment = 2;
  string inherited_environment = 3;
  string cluster_name = 4;
  string source = 5; // device, cluster, or unset
}

// Additive fields on the GET /v1/devices list/detail HTTP item.
// current_edge_id identifies the current installation; device_id remains durable.
message HostRuntimeBinding {
 uint64 device_id = 1;
 optional uint64 current_edge_id = 2;
}

// GET /v1/devices/{id}/plugins：长期配置归 Host，健康状态仅来自当前 Edge。
message HostPluginConfiguration {
 string plugin_name = 1;
 bool enabled = 2;
 google.protobuf.Struct spec = 3;
 // Cluster-managed node logs allow only journald_units to be edited.
 bool cluster_managed = 4 [json_name = "cluster_managed"];
}
// PUT /v1/devices/{id}/plugins/{name} (admin)，无需在线即可保存普通配置。
// Profiles 属于实例会话，不支持此入口；数据库凭据写入仍需要当前连接。
message SetHostPluginRequest {
 uint64 id = 1;
 string name = 2;
 bool enabled = 3;
 google.protobuf.Struct spec = 4;
 // Reject a node-only edit if the host's current installation has changed to an unmanaged one.
 bool cluster_managed = 5 [json_name = "cluster_managed"];
}

// PATCH /v1/devices/{id}/network/polling (admin).
// POST /v1/devices/{id}/network/snmp-test (admin): read-only, never saves.
// POST /v1/network-discovery/candidates/{id}/snmp-config (admin): verify, promote, configure.
// POST /v1/network-discovery/candidates/{id}/snmp-test (admin): read-only, never promotes.
message NetworkSNMPConfiguration {
 bool enabled = 1;
 uint32 interval_seconds = 2;
 string credential_name = 3;
 uint32 port = 4;
 string address = 5;
 uint64 scanner_host_device_id = 6;
}
message NetworkSNMPTestResult {
 bool ok = 1;
 string sys_name = 2;
 uint32 interface_count = 3;
 int64 duration_ms = 4;
}
// Additive fields on network detail; scanner_host_device_id remains discovery provenance.
message NetworkPollingSource {
 uint64 poll_scanner_host_device_id = 1;
}

// POST /v1/network-devices/snmp-test (admin): test a manually entered address.
// POST /v1/network-devices (admin): verify and create directly, without a discovery candidate.
// Both accept NetworkSNMPConfiguration. Create returns the network device detail;
// an already managed identity returns 409 rather than replacing its configuration.
