worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format structured escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"request_id":"$request_id"}';
  access_log /dev/stdout structured;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location = /readyz { access_log off; try_files /index.html =503; }
    location = /metrics { access_log off; default_type text/plain; return 200 '# HELP enterprise_demo_static_up Static demo web server availability.\n# TYPE enterprise_demo_static_up gauge\nenterprise_demo_static_up 1\n'; }
    location ~ ^/(api|v1)(/|$) { return 404; }
    location /assets/ { try_files $uri =404; }
    location ~ \.(docx|gz|txt|svg)$ { try_files $uri =404; }
    add_header Cache-Control 'no-cache' always;
    location / { try_files $uri /index.html; }
  }
}
