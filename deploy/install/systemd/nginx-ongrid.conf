# nginx site for the ongrid systemd install — 80 端口版本（内网部署）。
# ---------------------------------------------------------------------------
# WARNING：本文件与 sites-available/ongrid 互斥，二选一。
# 同时启用会触发 nginx `duplicate listen options for 0.0.0.0:80` 错误
# （listen 80 default_server 重复定义）+ map $http_upgrade 重复
# 定义。install-systemd.sh 默认走 sites-available/ongrid 路径，
# 本文件仅供非 Debian 布局或独立 conf.d 部署使用（operator 手动 cp 到
# /etc/nginx/conf.d/，不与本仓库 install 脚本混用）。
#
# 本仓库参考版，结构上与 sites-available/ongrid 一致，便于简单部署；
# sites-available+snippets 便于 Debian 标准 nginx 布局。
#
# 安装后如需启用 TLS：
#   1. 准备证书到 /etc/ongrid/certs/tls.{crt,key}
#   2. 取消下方 443 server block 注释
#   3. 在 sites-available/ongrid 加 HTTP→HTTPS 301 redirect
#   4. nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------

# WebSocket / SSE 升级映射（http context，必须在 server 块外）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# ----- 80 端口入口（内网部署，暂不 TLS）-----
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 50m;

    # 子路径规则单一来源：5 条 location 定义在 snippets 中，
    # 本仓库 conf 与 /etc/nginx/snippets/ongrid-locations.conf 同结构。
    include /etc/nginx/snippets/ongrid-locations.conf;
}

