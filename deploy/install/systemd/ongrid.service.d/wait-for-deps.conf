# ongrid.service drop-in：启动前置依赖就绪检查。
# ---------------------------------------------------------------------------
# 本 drop-in 让 ongrid.service 在 ExecStart 前调用 wait-for-deps.sh，
# 确保 MariaDB / Qdrant / frontier 三大依赖都 LISTEN 后才启动 manager，
# 避免 reboot 自启时因依赖未就绪进 panic 循环（风险前置缓解）。
#
# 严格模式：ExecStartPre 无 `-` 前缀，失败则 systemd 按 Restart=on-failure
# + StartLimitInterval=60s StartLimitBurst=3（ongrid.service 既有规则）重启。
# wait-for-deps.sh TIMEOUT 默认 120s（可用 ONGRID_WAIT_TIMEOUT 覆盖），
# 在 frontier 慢启动场景下给足启动窗口。
#
# wait-for-deps.sh 在仓库 deploy/install/systemd/ 根目录（不在 drop-in
# 目录内），install-systemd.sh 会 cp 到 /usr/local/bin/wait-for-deps.sh。
#
# ExecStartPost=-/usr/local/bin/ongrid-healthcheck.sh 接入
# 运行时 liveness 信号（供 systemd ExecStartPost 使用）。
# `-` 前缀容忍非零退出码（best-effort liveness probe，非启动 gate），
# 避免 manager 启动后端口未 listen 就立即 healthcheck 误判 unit failed。
# 真正的启动 gate 已由 ExecStartPre=wait-for-deps.sh + After= frontier
# 兜底；ExecStartPost 仅作为运行时探活信号（journalctl 可见 FAIL 日志）。
# ---------------------------------------------------------------------------

[Service]
ExecStartPre=/usr/local/bin/wait-for-deps.sh
ExecStartPost=-/usr/local/bin/ongrid-healthcheck.sh
