# Ongrid bare-metal (systemd) Prometheus scrape config.
# 与 compose 拓扑的 deploy/install/prometheus/prometheus.yml 区别：
#   - 全部 target 走 manager 主机 loopback（无容器 DNS）
#   - 补 node_exporter / process_exporter job（install-deps.sh 安装，
# 分别监听 127.0.0.1:19100 / 127.0.0.1:9256）
# 由 install-systemd.sh 部署到 /etc/ongrid/prometheus/prometheus.yml。
# 告警规则（rules.yml）由 install-systemd.sh 从 deploy/install/prometheus-rules.yml 部署。

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/ongrid/prometheus/rules.yml

scrape_configs:
  - job_name: ongrid
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:9100
        labels:
          service: ongrid
          env: prod

  # frontier broker（singchia/frontier）如启用自带 metrics exporter，
  # operator 按其配置自行追加 job（端口取决于 frontier 配置，此处不猜）。

  - job_name: node_exporter
    static_configs:
      - targets:
          - 127.0.0.1:19100

  - job_name: process_exporter
    static_configs:
      - targets:
          - 127.0.0.1:9256
