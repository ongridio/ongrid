# WebSocket / SSE 升级映射（http context，必须在 server 块外）。
# ---------------------------------------------------------------------------
# install-systemd.sh cp 本文件到 /etc/nginx/conf.d/ongrid-upgrade-map.conf
# （Debian nginx.conf 默认 include conf.d/*.conf 在 http context）。
# snippets/ongrid-locations.conf 引用 $connection_upgrade 依赖此 map。
#
# nginx-ongrid.conf（单体 conf 版本）保留了自己的 map 定义，但
# install-systemd.sh 的 sites-available 部署路径不 cp nginx-ongrid.conf，
# 仅从 snippets/ 复制 locations 与本 map 文件；若 map 只存在于单体版，
# `$connection_upgrade` 在该路径下未定义，nginx -t 报
# "unknown connection_upgrade variable"。抽到独立 conf.d 文件后，
# 两种部署路径都能正确加载此 map（conf.d/*.conf 在 http context，
# 与 sites-enabled/* 同级 include）。
# ---------------------------------------------------------------------------

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}
