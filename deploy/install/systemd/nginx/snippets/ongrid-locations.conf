# ongrid 子路径反代规则单一来源。
# 安全前提：本反代面向受信内网（管理入口）。公开暴露 80/443 前必须
# 自行叠加 TLS + 访问控制（auth_basic / auth_request / allow-deny）。
# ---------------------------------------------------------------------------
# 本片段由 nginx/sites-available/ongrid + nginx-ongrid.conf include，所有
# location 强制尾部斜杠（grafana/ 不写成 /grafana，避免 redirect 死循环，
# 缓解）。proxy_pass 使用 127.0.0.1:PORT（不写具体 IP，
# fresh host 部署时无需改配置）。
#
# $connection_upgrade 变量由 snippets/ongrid-upgrade-map.conf
# 定义（install-systemd.sh 部署到 /etc/nginx/conf.d/ongrid-upgrade-map.conf，
# http context）。本 snippets 只含 location 块，被 server include 时语义正确。
# nginx-ongrid.conf（单体版）保留自己的 map 定义作为非 Debian 布局备选，
# 但 install-systemd.sh 部署路径不使用 nginx-ongrid.conf，故不会与
# conf.d/ongrid-upgrade-map.conf 重复定义 map。
# ---------------------------------------------------------------------------

# ongrid manager — Web UI + API + SSE + WebSocket。
location / {
    proxy_pass         http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_buffering    off;            # SSE / streaming chat
    proxy_read_timeout 600s;
}

# 子路径无尾斜杠访问（grafana、/prometheus 等）显式 301
# 重定向到带斜杠版本。下方 proxy location 定义带尾斜杠（grafana/），
# 无斜杠访问会落入 location / 被 manager 404。浏览器自动去尾斜杠 /
# 链接漏写是常见行为，需显式 redirect 兜底。
location = /grafana     { return 301 /grafana/; }
location = /prometheus  { return 301 /prometheus/; }
location = /loki        { return 301 /loki/; }
location = /tempo       { return 301 /tempo/; }

# Grafana — 需 /etc/grafana/grafana.ini [server] section 同步设置：
#   serve_from_sub_path = true
#   root_url = %(protocol)s://%(domain)s/grafana/
location /grafana/ {
    proxy_pass         http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
}

# Prometheus — 需 prometheus.service 配 --web.external-url=http://<host>/prometheus/
# 管理端点封禁：remote-write / lifecycle 类 API 不经反代暴露
#（manager 与 Prometheus 同机 loopback 直连，不需要走 nginx）。
location /prometheus/-/ { return 403; }
location = /prometheus/api/v1/write { return 403; }
location /loki/api/v1/push { return 403; }

location /prometheus/ {
    proxy_pass         http://127.0.0.1:9090/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
}

# Loki — /ready /metrics 等端点反代
location /loki/ {
    proxy_pass         http://127.0.0.1:3100/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
}

# Tempo — /ready /api/search 等端点反代
location /tempo/ {
    proxy_pass         http://127.0.0.1:3200/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
}
